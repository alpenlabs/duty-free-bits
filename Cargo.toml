[package]
name = "duty-free-bits"
version = "0.1.0"
edition = "2024"
authors = [
  "Nakul Khambhati <nakul@cs.ucla.edu>",
  "David Heath <daheath@illinois.edu>",
]
description = "Switch system construction from Duty-Free Bits"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/alpenlabs/duty-free-bits"
categories = ["cryptography"]
keywords = ["garbled-circuits", "mpc", "switch-system", "bitvm"]

# Lints live as crate attributes in src/lib.rs (the [lints] table tripped the
# editor's stale Cargo schema; source attributes also avoid the group/lint
# priority dance).

[features]
# Enable a process-global CCRH (AES-block) counter for per-party hash accounting
# in benchmarks. OFF by default — zero overhead on the hot path when disabled.
count-hashes = []

[dependencies]
mimalloc = { version = "0.1", default-features = false }
rand = "0.10"

[profile.release]
opt-level = 3     # Compute-bound CCRH/modular kernel: ~2.9x faster than "z"
lto = true        # Enable Link Time Optimization
codegen-units = 1 # Reduced to increase optimizations
panic = "abort"   # Abort on panic
strip = "symbols" # Strip symbols from binary
